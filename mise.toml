# Developer tools pinned for local runs and CI (`mise install`).
# Rust itself is pinned by rust-toolchain.toml (rustup).
[tools]
"aqua:casey/just" = "1.59.0"
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:biomejs/biome" = "2.6.7"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:rvben/rumdl" = "0.3.4"
"aqua:orhun/git-cliff" = "2.14.2"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"

[settings]
lockfile = true
