[package]
name = "uti-core"
version = "0.4.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
quick-xml = { version = "0.42", features = ["serialize"], optional = true }
percent-encoding = { version = "2", optional = true }
rusqlite = { version = "0.42", features = ["bundled"], optional = true }
uuid = { version = "1", features = ["v4"] }

[features]
default = ["launcher"]
# Launcher config and recent-file sources (XBEL, VS Code SQLite).
launcher = ["dep:quick-xml", "dep:percent-encoding", "dep:rusqlite"]

[dev-dependencies]
tempfile = "3"
