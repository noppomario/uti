# Rust formatting configuration
# https://rust-lang.github.io/rustfmt/ (stable options only)

edition = "2021"
max_width = 100
hard_tabs = false
tab_spaces = 4

# Style
use_small_heuristics = "Default"
fn_call_width = 80
struct_lit_width = 18
array_width = 80
chain_width = 80

# Formatting
newline_style = "Unix"
remove_nested_parens = true
use_field_init_shorthand = true
use_try_shorthand = true

# Match
match_arm_leading_pipes = "Never"
match_block_trailing_comma = true
