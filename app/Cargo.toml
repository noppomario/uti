[package]
name = "uti"
version.workspace = true
edition = "2021"
license = "MIT"
publish = false
description = "uti main application (GTK4 / libadwaita)"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
async-channel = "2"
serde_json = "1"
dirs = "7"
percent-encoding = "2"
quick-xml = { version = "0.42", features = ["serialize"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
