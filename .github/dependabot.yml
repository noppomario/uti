version: 2
updates:
  # Root bun workspace
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      bun-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # app/ (Tauri + React) is intentionally not tracked while the GNOME-native
  # rewrite is in progress (docs/plans/gnome-native-rewrite.md). Re-add the
  # new app crate in Phase 3.

  # Daemon (daemon/) - Cargo
  - package-ecosystem: "cargo"
    directory: "/daemon"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "daemon"
    commit-message:
      prefix: "chore(deps)"
    groups:
      daemon-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
