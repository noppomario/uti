# Release: merging a `release/vX.Y.Z` PR (opened by the release skill) tags
# the merge commit and publishes the release in this same workflow. Tags
# pushed with GITHUB_TOKEN do not trigger other workflows, so no PAT is
# needed. A manually pushed `v*` tag runs the release job only.
#
# Packages are built by COPR (packaging/uti.spec); the GitHub Release only
# carries release notes.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tag:
    name: Create Release Tag
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPO: ${{ github.repository }}
        run: |
          tag="${HEAD_REF#release/}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release branch: $HEAD_REF"
            exit 1
          fi
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Create GitHub Release
    needs: tag
    # Runs after `tag`, or alone for a manually pushed tag.
    if: always() && (needs.tag.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: aqua:orhun/git-cliff
      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git-cliff --latest --strip header > "$RUNNER_TEMP/release-notes.md"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          body_path: ${{ runner.temp }}/release-notes.md
      - name: Trigger COPR build
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          if [ -z "$COPR_WEBHOOK_URL" ]; then
            echo "::warning::COPR_WEBHOOK_URL is not set; no package build was started"
            exit 0
          fi
          curl -fsS -X POST "$COPR_WEBHOOK_URL"
      - name: Notify release
        env:
          REPO: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          curl -s \
            -H "Title: uti $TAG released" \
            -H "Tags: white_check_mark,rocket" \
            -d "https://github.com/$REPO/releases/tag/$TAG" \
            "https://ntfy.sh/$NTFY_TOPIC"
