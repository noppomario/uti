name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly full run: picks up newly published advisories (cargo-deny).
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Select jobs
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      extension: ${{ steps.diff.outputs.extension }}
      package: ${{ steps.diff.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pushes to main and manual runs check everything.
          if [ "$EVENT" != pull_request ]; then
            printf '%s\n' rust=true extension=true package=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          shared='^(justfile|mise\.(toml|lock)|\.github/workflows/ci\.yml)$'
          match() { printf '%s\n' "$files" | grep -qE "$1|$shared" && echo true || echo false; }
          {
            echo "rust=$(match '^(app|daemon)/|^(Cargo\.(toml|lock)|rust-toolchain\.toml|rustfmt\.toml|deny\.toml)$')"
            echo "extension=$(match '^gnome-extension/')"
            echo "package=$(match '^(packaging|\.copr|app/packaging|daemon/(systemd|udev)|gnome-extension/schemas)/|^(Cargo\.(toml|lock)|gnome-extension/metadata\.json)$')"
          } >> "$GITHUB_OUTPUT"

  rust:
    name: Rust lint and test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # libadwaita 1.9 (GNOME 50) is not on Ubuntu. Same Fedora as development.
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Restore dnf cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/libdnf5
          key: dnf-fedora44-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install system packages
        run: |
          dnf install -y --setopt=install_weak_deps=False --setopt=keepcache=True \
            git gcc rustup gtk4-devel libadwaita-devel
          rustup-init -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: aqua:casey/just
      - run: just lint-rust
      - run: just test

  deny:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: aqua:casey/just aqua:EmbarkStudios/cargo-deny
      - run: just deny

  markdown:
    name: Docs, workflow and shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: aqua:casey/just aqua:rvben/rumdl aqua:rhysd/actionlint aqua:koalaman/shellcheck
      - run: just lint-md lint-gha lint-sh

  extension:
    name: Extension lint
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: aqua:casey/just aqua:biomejs/biome
      - run: just lint-ext

  # Builds the SRPM from this commit with the script COPR uses (COPR itself
  # builds the latest tag), then the RPMs offline with Fedora's rust, so spec
  # and vendoring breakage shows up before a release.
  package:
    name: RPM build (fedora ${{ matrix.fedora }})
    needs: changes
    if: needs.changes.outputs.package == 'true' && github.event_name != 'schedule'
    # Same Fedora releases as the COPR chroots (Rust lint and test follows the
    # development Fedora instead).
    strategy:
      fail-fast: false
      matrix:
        fedora: [44, 45]
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - name: Restore dnf cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/libdnf5
          key: dnf-package-fedora${{ matrix.fedora }}-${{ hashFiles('packaging/uti.spec') }}
      - name: Install SRPM tools
        run: |
          dnf install -y --setopt=install_weak_deps=False --setopt=keepcache=True \
            git cargo rpm-build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags for the version
          persist-credentials: false
      - name: Build SRPM
        run: packaging/make-srpm.sh dist
      - name: Install build dependencies
        run: dnf builddep -y --setopt=install_weak_deps=False --setopt=keepcache=True dist/*.src.rpm
      - name: Build RPMs
        run: rpmbuild --rebuild dist/*.src.rpm --define "_rpmdir $PWD/dist"
      - run: ls -l dist/*/

  # Required status check: passes when every job passed or was skipped.
  ci:
    name: Merge gate
    needs: [changes, rust, deny, markdown, extension, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
