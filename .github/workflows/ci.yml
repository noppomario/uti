name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    # libadwaita 1.9 (GNOME 50) is not on Ubuntu, so build in Fedora.
    container: fedora:44
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}-ci', github.ref_name) || format('ci-{0}', github.ref) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Install toolchain and GTK
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git unzip cargo rustfmt clippy gcc gtk4-devel libadwaita-devel

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "uti-build"
          cache-on-failure: true

      - name: Install root dependencies
        run: bun install

      - name: Run lint checks
        run: bun run ci:check

      - name: Run tests
        run: bun run ci:test

      - name: Run build
        run: bun run ci:build
