# Git hooks (`just setup`). CI runs the same checks through just recipes.
# Skip once with LEFTHOOK=0.

pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true
    - name: biome
      root: gnome-extension/
      glob: "*.js"
      run: biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: rumdl
      glob: "*.md"
      run: rumdl check --fix {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: conventional-commits
      run: |
        msg=$(head -n1 "{1}")
        case "$msg" in "Merge "*|"Revert "*|"fixup! "*|"squash! "*) exit 0 ;; esac
        printf '%s' "$msg" | grep -qE '^(feat|fix|perf|refactor|docs|test|style|build|ci|chore)(\([a-z0-9._/-]+\))?!?: .+' && exit 0
        echo "Commit message must follow Conventional Commits, e.g. 'fix(app): handle X'" >&2
        exit 1

pre-push:
  jobs:
    - name: clippy-and-test
      run: just lint-rust test
